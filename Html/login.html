<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="styles.css">
    <title>Login - Achados e Perdidos</title>
</head>

<body>
    <main class="container">
        <form id="form-login" action="/login" method="POST">
            <h1>Login</h1>
            <div class="input-box">
                <input type="email" id="Usuário" name="Usuário" placeholder="Usuário" required>
                <i class='bx bx-user'></i>
            </div>
            <div class="input-box">
                <input type="password" id="Senha" name="Senha" placeholder="Senha" required>
                <i class='bx bx-lock-alt'></i>
            </div>

            <div class="remember-forgot">
                <input type="checkbox" id="remember">
                <label for="remember">Lembra-me</label>
                <a href="#">Esqueci a senha</a>
            </div>
            <input type="submit" class="Login" value="Login">
            <div class="register-link">
                <p>Não tem uma conta? <a href="./cadastro.html">Cadastre-se</a></p>
            </div>
        </form>
    </main>

    <script>
        const formLogin = document.getElementById("form-login");

        formLogin.addEventListener("submit", function (e) {
            e.preventDefault();

            const usuario = document.getElementById("Usuário").value.trim();
            const lembrar = document.getElementById("remember").checked;

            const maxAge = lembrar ? "; max-age=604800" : "";

            document.cookie = `usuario_logado=${encodeURIComponent(usuario)}${maxAge}; path=/; SameSite=Lax`;

            // Altere "index.html" para o nome da página que abre após o login
            window.location.href = "inicio.html";
        });
    </script>
</body>

</html>
